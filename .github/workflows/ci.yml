name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium for the measured browser gate
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate product specification and repository paths
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/check_sdd.py
          python scripts/check_doc_paths.py
          python scripts/check_readme_areas.py
          python scripts/check_tech_matrix.py
          python scripts/check_contracts.py docs/contracts/catalog.md
          python scripts/check_skeleton.py docs/contracts/catalog.md
          if [[ "$GITHUB_EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_contract_versions.py --base "$GITHUB_EVENT_BEFORE"
          else
            python scripts/check_contract_versions.py --base origin/develop
          fi
          python scripts/check_documents.py
      - name: Validate content and generated research data
        run: |
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
          python scripts/check_version_coherence.py
          python scripts/check_product_completeness.py
          python scripts/check_frontend_adr.py
          python scripts/check_web_baseline.py
          python scripts/check_artifacts.py
          python scripts/check_notebooks.py
          python scripts/check_svg_animation.py
          python scripts/check_deploy_place.py
      - name: Frontend, build, and shell rendering gates
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
          npm --prefix frontend run gate
      - name: CI budget guard
        run: python scripts/check_ci_budget.py
