<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" class="arch-svg" role="img">
  <style>.bg{fill:var(--color-surface)}.bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.5}.hi{stroke:var(--color-accent);stroke-width:2}.good{stroke:var(--color-good);stroke-width:2}.warn{stroke:var(--color-warn);stroke-width:2}.ttl{fill:var(--color-fg);font:600 13px system-ui}.sub{fill:var(--color-fg-subtle);font:10px system-ui}.cd{fill:var(--color-accent);font:10px ui-monospace,monospace}.it{fill:var(--color-fg);font:11px system-ui}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5;marker-end:url(#a)}.lbl{fill:var(--color-fg-subtle);font:9.5px system-ui}.l-es{display:none}[data-arch-lang="es"] .l-en{display:none}[data-arch-lang="es"] .l-es{display:block}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle)"/></marker></defs><rect class="bg" width="880" height="470" rx="18"/>
  <text class="ttl l-en" x="34" y="36">THEOREM CERTIFICATE AND EXPLANATORY LENSES</text><text class="ttl l-es" x="34" y="36">CERTIFICADO DEL TEOREMA Y LENTES EXPLICATIVAS</text>
  <rect class="bx hi" x="34" y="70" width="250" height="128" rx="14"/><text class="ttl l-neutral" x="52" y="96">x_n = {φ + nα}</text><text class="cd l-en" x="52" y="120">direct sorted orbit</text><text class="cd l-es" x="52" y="120">órbita directa ordenada</text><text class="it l-en" x="52" y="147">sort points · close wrap gap</text><text class="it l-es" x="52" y="147">ordenar puntos · cerrar brecha</text><text class="sub l-neutral" x="52" y="174">Σg_i = 1</text>
  <rect class="bx good" x="316" y="70" width="250" height="128" rx="14"/><text class="ttl l-en" x="334" y="96">Classical certificate</text><text class="ttl l-es" x="334" y="96">Certificado clásico</text><text class="cd l-neutral" x="334" y="120">D_N ≤ 3</text><text class="it l-en" x="334" y="147">three lengths: c = a + b</text><text class="it l-es" x="334" y="147">tres longitudes: c = a + b</text><text class="sub l-en" x="334" y="174">declared irrational rotation only</text><text class="sub l-es" x="334" y="174">solo rotación irracional declarada</text>
  <rect class="bx warn" x="598" y="70" width="248" height="128" rx="14"/><text class="ttl l-en" x="616" y="96">Boundary classifier</text><text class="ttl l-es" x="616" y="96">Clasificador de frontera</text><text class="cd l-en" x="616" y="120">mode + collisions + process</text><text class="cd l-es" x="616" y="120">modo + colisiones + proceso</text><text class="it l-en" x="616" y="147">rational · numeric · contrast</text><text class="it l-es" x="616" y="147">racional · numérico · contraste</text><text class="sub l-en" x="616" y="174">no decimal irrationality claim</text><text class="sub l-es" x="616" y="174">sin afirmar irracionalidad decimal</text>
  <path class="flow" d="M284 134H306"/><path class="flow" d="M566 134H588"/>
  <rect class="bx" x="34" y="252" width="812" height="174" rx="14"/><text class="ttl l-en" x="52" y="278">Derived readings, never substitutes for the direct oracle</text><text class="ttl l-es" x="52" y="278">Lecturas derivadas, nunca sustitutos del oráculo directo</text>
  <g><rect class="bx hi" x="54" y="307" width="141" height="84" rx="10"/><text class="it l-en" x="70" y="332">Farey cell</text><text class="it l-es" x="70" y="332">Celda de Farey</text><text class="cd l-neutral" x="70" y="353">a/b &lt; α &lt; c/d</text><text class="sub l-en" x="70" y="374">event geometry</text><text class="sub l-es" x="70" y="374">geometría de eventos</text><rect class="bx" x="212" y="307" width="141" height="84" rx="10"/><text class="it l-en" x="228" y="332">Continued fraction</text><text class="it l-es" x="228" y="332">Fracción continua</text><text class="cd l-neutral" x="228" y="353">p_k / q_k</text><text class="sub l-en" x="228" y="374">best approximants</text><text class="sub l-es" x="228" y="374">mejores aproximantes</text><rect class="bx" x="370" y="307" width="141" height="84" rx="10"/><text class="it l-en" x="386" y="332">Return times</text><text class="it l-es" x="386" y="332">Tiempos de retorno</text><text class="cd l-neutral" x="386" y="353">n_(j+1) - n_j</text><text class="sub l-en" x="386" y="374">dual gaps</text><text class="sub l-es" x="386" y="374">brechas duales</text><rect class="bx" x="528" y="307" width="141" height="84" rx="10"/><text class="it l-neutral" x="544" y="332">Rips H0</text><text class="cd l-en" x="544" y="353">components(r)</text><text class="cd l-es" x="544" y="353">componentes(r)</text><text class="sub l-en" x="544" y="374">merge thresholds</text><text class="sub l-es" x="544" y="374">umbrales de fusión</text><rect class="bx warn" x="686" y="307" width="138" height="84" rx="10"/><text class="it l-en" x="702" y="332">Contrasts</text><text class="it l-es" x="702" y="332">Contrastes</text><text class="cd l-en" x="702" y="353">random · farthest</text><text class="cd l-es" x="702" y="353">aleatorio · más lejano</text><text class="sub l-en" x="702" y="374">hypothesis tests</text><text class="sub l-es" x="702" y="374">pruebas de hipótesis</text></g>
</svg>
