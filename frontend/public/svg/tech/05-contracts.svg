<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" class="arch-svg" role="img">
  <style>.bg{fill:var(--color-surface-1,#0b1620)}.bx{fill:var(--color-surface-2,#10232f);stroke:var(--color-border,#31505b);stroke-width:1.5}.hi{stroke:var(--color-accent,#58d2c2);stroke-width:2}.good{stroke:var(--color-good,#78d99a);stroke-width:2}.warn{stroke:var(--color-warn,#f1b66e);stroke-width:2}.ttl{fill:var(--color-fg,#edf5f2);font:600 13px system-ui}.sub{fill:var(--color-fg-subtle,#a4b9ba);font:10px system-ui}.cd{fill:var(--color-accent,#58d2c2);font:10px ui-monospace,monospace}.it{fill:var(--color-fg,#edf5f2);font:11px system-ui}.flow{fill:none;stroke:var(--color-fg-subtle,#a4b9ba);stroke-width:1.5;marker-end:url(#a)}.lbl{fill:var(--color-fg-subtle,#a4b9ba);font:9.5px system-ui}.l-es{display:none}[data-arch-lang="es"] .l-en{display:none}[data-arch-lang="es"] .l-es{display:block}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle,#a4b9ba)"/></marker></defs><rect class="bg" width="880" height="470" rx="18"/>
