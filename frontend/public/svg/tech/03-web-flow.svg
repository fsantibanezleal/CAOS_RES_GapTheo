  <rect class="bx hi" x="34" y="74" width="170" height="116" rx="13"/><text class="ttl l-en" x="52" y="99">Select and tune</text><text class="ttl l-es" x="52" y="99">Seleccionar y ajustar</text><text class="cd l-neutral" x="52" y="122">CaseSelector</text><text class="it l-neutral" x="52" y="147">α · N · φ</text><text class="it l-en" x="52" y="169">beta · process · seed</text><text class="it l-es" x="52" y="169">β · proceso · semilla</text>
  <rect class="bx good" x="260" y="74" width="180" height="116" rx="13"/><text class="ttl l-en" x="278" y="99">Normalize regime</text><text class="ttl l-es" x="278" y="99">Normalizar régimen</text><text class="cd l-neutral" x="278" y="122">normalizeScenario()</text><text class="it l-en" x="278" y="147">rational residues</text><text class="it l-es" x="278" y="147">residuos racionales</text><text class="it l-en" x="278" y="169">numeric tolerance</text><text class="it l-es" x="278" y="169">tolerancia numérica</text>
  <rect class="bx hi" x="496" y="74" width="180" height="116" rx="13"/><text class="ttl l-en" x="514" y="99">Compute once</text><text class="ttl l-es" x="514" y="99">Calcular una vez</text><text class="cd l-neutral" x="514" y="122">computeCertificate()</text><text class="it l-en" x="514" y="147">stable point and gap ids</text><text class="it l-es" x="514" y="147">ids estables de puntos y brechas</text><text class="it l-en" x="514" y="169">all derived readings</text><text class="it l-es" x="514" y="169">todas las lecturas derivadas</text>
  <rect class="bx warn" x="732" y="74" width="114" height="116" rx="13"/><text class="ttl l-en" x="750" y="99">Status</text><text class="ttl l-es" x="750" y="99">Estado</text><text class="cd l-neutral" x="750" y="122">D_N</text><text class="it l-neutral" x="750" y="147">≤ 3</text><text class="it l-neutral" x="750" y="169">c = a + b</text>
  <path class="flow" d="M204 132H250"/><text class="lbl l-en" x="211" y="122">params</text><text class="lbl l-es" x="211" y="122">parámetros</text><path class="flow" d="M440 132H486"/><text class="lbl l-en" x="449" y="122">state</text><text class="lbl l-es" x="449" y="122">estado</text><path class="flow" d="M676 132H722"/><text class="lbl l-en" x="688" y="122">checks</text><text class="lbl l-es" x="688" y="122">controles</text>
