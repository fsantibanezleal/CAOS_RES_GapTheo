<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" class="arch-svg" role="img" aria-label="A 23 point orbit of sqrt two minus one has three gap classes and satisfies the additive length relation">
<style>
.arch-svg text{font-family:var(--font-sans)}.arch-svg .mono{font-family:var(--font-mono)}
.arch-svg .title{fill:var(--color-fg);font-size:19px;font-weight:700}.arch-svg .head{fill:var(--color-accent);font-size:11px;font-weight:700;letter-spacing:.08em}
.arch-svg .label{fill:var(--color-fg);font-size:13px;font-weight:600}.arch-svg .value{fill:var(--color-fg);font-size:14px;font-weight:700}.arch-svg .note{fill:var(--color-fg-subtle);font-size:11px}
.arch-svg .ring{fill:none;stroke:var(--color-border);stroke-width:1.2}.arch-svg .rule{stroke:var(--color-border);stroke-width:1.2}
.l-es{display:none}[data-arch-lang="es"] .l-en{display:none}[data-arch-lang="es"] .l-es{display:inline}
</style>
<text class="title l-en" x="30" y="40">The finite geometry and the three-gap relation</text><text class="title l-es" x="30" y="40">Geometría finita y relación de las tres brechas</text>
<text class="note l-en" x="30" y="68">A computed example for α = √2 − 1 and N = 23; all lengths are measured in turns.</text><text class="note l-es" x="30" y="68">Ejemplo calculado con α = √2 − 1 y N = 23; las longitudes se miden en vueltas.</text>
