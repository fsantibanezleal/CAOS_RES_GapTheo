<text class="head l-en" x="500" y="126">SORTED ORBIT · CLOSING GAP INCLUDED</text><text class="head l-es" x="500" y="126">ÓRBITA ORDENADA · INCLUYE EL CIERRE</text>
<text class="note mono l-neutral" x="500" y="160">α = √2 − 1     N = 23     φ = 0</text>
<line x1="500" y1="184" x2="920" y2="184" class="rule"/>
<line x1="502" y1="216" x2="532" y2="216" stroke="var(--color-accent)" stroke-width="5" stroke-linecap="round"/><text class="label l-en" x="548" y="220">Short</text><text class="label l-es" x="548" y="220">Corta</text><text class="value mono l-neutral" x="675" y="220">0.029437 · 11 arcs</text>
<line x1="502" y1="260" x2="532" y2="260" stroke="var(--color-warn)" stroke-width="6" stroke-linecap="round"/><text class="label l-en" x="548" y="264">Middle</text><text class="label l-es" x="548" y="264">Mediana</text><text class="value mono l-neutral" x="675" y="264">0.041631 · 6 arcs</text>
<line x1="502" y1="304" x2="532" y2="304" stroke="var(--color-good)" stroke-width="8" stroke-linecap="round"/><text class="label l-en" x="548" y="308">Long</text><text class="label l-es" x="548" y="308">Larga</text><text class="value mono l-neutral" x="675" y="308">0.071068 · 6 arcs</text>
<line x1="500" y1="336" x2="920" y2="336" class="rule"/>
<text class="head l-en" x="500" y="374">ADDITIVE RELATION</text><text class="head l-es" x="500" y="374">RELACIÓN ADITIVA</text>
<text class="value mono l-neutral" x="500" y="414">0.071068 ≈ 0.029437 + 0.041631</text>
<text class="note l-en" x="500" y="452">For three distinct gaps, the largest equals the sum of the other two.</text><text class="note l-es" x="500" y="452">Con tres brechas distintas, la mayor es la suma de las otras dos.</text>
<text class="note l-en" x="500" y="478">This direct finite computation illustrates the relation; it is not its proof.</text><text class="note l-es" x="500" y="478">Este cálculo finito ilustra la relación; no constituye su demostración.</text>
<text class="note l-en" x="30" y="510">The continued fraction [0; 2, 2, 2, …] organizes rational approximants to this rotation number.</text><text class="note l-es" x="30" y="510">La fracción continua [0; 2, 2, 2, …] organiza los aproximantes racionales de este número de rotación.</text>
