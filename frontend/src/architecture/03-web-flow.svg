<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" class="arch-svg" role="img" aria-label="A scenario selection updates all linked finite rotation views">
  <style>
    .arch-svg text{font-family:var(--font-sans)}.arch-svg .mono{font-family:var(--font-mono)}
    .arch-svg .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5}.arch-svg .instrument{fill:var(--color-surface-2);stroke:var(--color-accent);stroke-width:1.5}
    .arch-svg .title{fill:var(--color-fg);font-size:18px;font-weight:700}.arch-svg .head{fill:var(--color-accent);font-size:12px;font-weight:700;letter-spacing:.06em}.arch-svg .label{fill:var(--color-fg);font-size:13px;font-weight:600}.arch-svg .note{fill:var(--color-fg-subtle);font-size:11px}.arch-svg .arrow{fill:none;stroke:var(--color-fg-faint);stroke-width:1.7;marker-end:url(#wf-arrow)}
    .l-es{display:none}[data-arch-lang="es"] .l-en{display:none}[data-arch-lang="es"] .l-es{display:inline}
  </style>
  <defs><marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-faint)"/></marker></defs>
  <text class="title l-en" x="30" y="40">Every panel is derived from the active scenario</text><text class="title l-es" x="30" y="40">Cada panel deriva del escenario activo</text>
  <rect class="panel" x="30" y="82" width="230" height="210" rx="18"/><text class="head l-en" x="54" y="116">INPUT</text><text class="head l-es" x="54" y="116">ENTRADA</text>
  <text class="label l-en" x="54" y="150">Choose or edit a case</text><text class="label l-es" x="54" y="150">Elegir o editar un caso</text><text class="note mono l-neutral" x="54" y="182">α · N · φ · β</text><text class="note l-en" x="54" y="214">step, count, phase, interval</text><text class="note l-es" x="54" y="214">paso, cantidad, fase, intervalo</text><text class="note l-en" x="54" y="246">process · seed · tolerance</text><text class="note l-es" x="54" y="246">proceso · semilla · tolerancia</text>
  <path class="arrow" d="M268 188H330"/><rect class="instrument" x="340" y="82" width="280" height="210" rx="18"/><text class="head l-en" x="364" y="116">ONE FINITE CERTIFICATE</text><text class="head l-es" x="364" y="116">UN CERTIFICADO FINITO</text><text class="label mono l-neutral" x="364" y="158">computeCertificate(scenario)</text><text class="note l-en" x="364" y="194">points · cyclic gaps · multiplicities</text><text class="note l-es" x="364" y="194">puntos · brechas cíclicas · multiplicidades</text><text class="note l-en" x="364" y="222">Farey check · returns · residuals</text><text class="note l-es" x="364" y="222">control Farey · retornos · residuos</text><text class="note l-en" x="364" y="258">status follows declared hypotheses</text><text class="note l-es" x="364" y="258">el estado sigue las hipótesis declaradas</text>
  <path class="arrow" d="M628 188H690"/><rect class="panel" x="700" y="82" width="230" height="210" rx="18"/><text class="head l-en" x="724" y="116">LINKED VIEWS</text><text class="head l-es" x="724" y="116">VISTAS VINCULADAS</text><text class="label l-en" x="724" y="150">Circle and interval</text><text class="label l-es" x="724" y="150">Círculo e intervalo</text><text class="label l-en" x="724" y="180">Farey and return structure</text><text class="label l-es" x="724" y="180">Estructura Farey y de retornos</text><text class="label l-en" x="724" y="210">Word and H₀ filtration</text><text class="label l-es" x="724" y="210">Palabra y filtración H₀</text><text class="label l-en" x="724" y="240">Allocator comparison</text><text class="label l-es" x="724" y="240">Comparación de asignadores</text>
  <path d="M815 302V338H145V302" fill="none" stroke="var(--color-border)" stroke-width="1.5"/><text class="note l-en" x="250" y="366">Changing any control recomputes the shared state; contrast allocators remain outside the theorem regime.</text><text class="note l-es" x="252" y="366">Cada cambio recalcula el estado compartido; los asignadores de contraste quedan fuera del régimen del teorema.</text>
</svg>
