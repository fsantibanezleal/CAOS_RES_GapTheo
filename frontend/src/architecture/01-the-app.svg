<text class="head l-en" x="660" y="108">OBSERVED GAP CLASSES</text><text class="head l-es" x="660" y="108">CLASES DE BRECHA OBSERVADAS</text>
<line x1="662" y1="145" x2="694" y2="145" stroke="var(--color-accent)" stroke-width="5" stroke-linecap="round"/>
<text class="label l-en" x="708" y="149">Shorter gap</text><text class="label l-es" x="708" y="149">Brecha menor</text>
<text class="value mono l-neutral" x="708" y="177">0.02129 turns · 13 gaps</text>
<line x1="662" y1="218" x2="694" y2="218" stroke="var(--color-warn)" stroke-width="7" stroke-linecap="round"/>
<text class="label l-en" x="708" y="222">Longer gap</text><text class="label l-es" x="708" y="222">Brecha mayor</text>
<text class="value mono l-neutral" x="708" y="250">0.03444 turns · 21 gaps</text>
<line x1="660" y1="278" x2="930" y2="278" stroke="var(--color-border)"/>
<text class="note l-en" x="660" y="310">Sorted points close the circle;</text><text class="note l-es" x="660" y="310">Los puntos ordenados cierran el círculo;</text>
<text class="note l-en" x="660" y="330">all 34 arcs sum to one turn.</text><text class="note l-es" x="660" y="330">los 34 arcos suman una vuelta.</text>
<text class="note l-en" x="660" y="372">A finite certificate checks this input.</text><text class="note l-es" x="660" y="372">Un certificado finito comprueba esta entrada.</text>
<text class="note l-en" x="660" y="392">It does not prove the infinite theorem.</text><text class="note l-es" x="660" y="392">No demuestra el teorema infinito.</text>
<text class="note l-en" x="30" y="475">Selecting a case or changing a control recomputes the same state shown in every view.</text><text class="note l-es" x="30" y="475">Elegir un caso o cambiar un control recalcula el mismo estado mostrado en todas las vistas.</text>
</svg>
