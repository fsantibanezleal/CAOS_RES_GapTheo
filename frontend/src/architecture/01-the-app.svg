<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" class="arch-svg" role="img" aria-label="The workbench controls a finite irrational rotation and displays the resulting circular partition">
<style>
.arch-svg text{font-family:var(--font-sans)}.arch-svg .mono{font-family:var(--font-mono)}
.arch-svg .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5}
.arch-svg .ring{fill:none;stroke:var(--color-border);stroke-width:1.2}
.arch-svg .title{fill:var(--color-fg);font-size:19px;font-weight:700}
.arch-svg .head{fill:var(--color-accent);font-size:11px;font-weight:700;letter-spacing:.08em}
.arch-svg .label{fill:var(--color-fg);font-size:13px;font-weight:600}
.arch-svg .note{fill:var(--color-fg-subtle);font-size:11px}
.arch-svg .value{fill:var(--color-fg);font-size:15px;font-weight:700}
.l-es{display:none}[data-arch-lang="es"] .l-en{display:none}[data-arch-lang="es"] .l-es{display:inline}
</style>
<text class="title l-en" x="30" y="40">The workbench: parameters, orbit, measured gaps</text><text class="title l-es" x="30" y="40">El banco de trabajo: parámetros, órbita y brechas medidas</text>
<rect class="panel" x="30" y="74" width="232" height="352" rx="18"/>
<text class="head l-en" x="54" y="108">SCENARIO</text><text class="head l-es" x="54" y="108">ESCENARIO</text>
<text class="label l-en" x="54" y="146">Golden conjugate</text><text class="label l-es" x="54" y="146">Conjugado áureo</text>
<text class="note l-en" x="54" y="172">Rotation number</text><text class="note l-es" x="54" y="172">Número de rotación</text>
<text class="value mono l-neutral" x="54" y="198">α = (√5 − 1) / 2</text>
<text class="note l-en" x="54" y="238">Point count</text><text class="note l-es" x="54" y="238">Cantidad de puntos</text>
<text class="value mono l-neutral" x="54" y="264">N = 34</text>
<line x1="54" y1="286" x2="238" y2="286" stroke="var(--color-border)"/>
<text class="note l-en" x="54" y="316">Initial phase</text><text class="note l-es" x="54" y="316">Fase inicial</text>
<text class="value mono l-neutral" x="54" y="342">φ = 0</text>
<text class="note l-en" x="54" y="384">Rotation allocator</text><text class="note l-es" x="54" y="384">Asignador por rotación</text>
<text class="value mono l-neutral" x="54" y="406">allocator = rotation</text>
